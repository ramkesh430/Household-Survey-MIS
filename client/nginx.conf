server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 500m;   # backup uploads (admin restore); JSON bodies are limited to 2 MB by the API
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_read_timeout 300s;   # large dataset exports / restores
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # service worker & manifest must never be cached long, or phones keep an old version
  location = /sw.js { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location /assets/ { include /etc/nginx/snippets/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
